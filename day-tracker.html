<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  .st-root * { box-sizing: border-box; }
  .st-root {
    --bg: #11131c;
    --surface: #1a1d2b;
    --surface-2: #222639;
    --border: #2a2f45;
    --text: #edeff7;
    --muted: #8991ac;
    --mint: #35e0a0;
    --mint-dim: rgba(53,224,160,0.14);
    --coral: #ff6b57;
    --coral-dim: rgba(255,107,87,0.14);
    --amber: #ffb84d;
    --amber-dim: rgba(255,184,77,0.14);
    font-family: 'Inter', -apple-system, sans-serif;
    background: radial-gradient(120% 140% at 10% 0%, #171b2b 0%, #11131c 55%);
    color: var(--text);
    padding: 20px 16px 40px;
    min-height: 100%;
    border-radius: 16px;
  }
  .st-display { font-family: 'Space Grotesk', 'Inter', sans-serif; }

  .st-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .st-title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .st-sub { color: var(--muted); font-size: 13px; margin-top: 4px; }

  .st-daybadge {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    text-align: right;
    min-width: 130px;
  }
  .st-daybadge .num { font-family:'Space Grotesk'; font-size: 20px; font-weight: 700; color: var(--mint); }
  .st-daybadge .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .st-daybadge input[type=date] {
    background: transparent; border: none; color: var(--muted); font-size: 10px;
    margin-top: 4px; padding: 0; font-family: inherit; cursor: pointer;
  }

  .st-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .st-tab {
    flex: 1;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    text-align: center;
    transition: all .15s ease;
  }
  .st-tab.active { background: var(--mint-dim); border-color: var(--mint); color: var(--mint); }

  .st-grid { display: grid; grid-template-columns: 1fr; gap: 18px; }
  @media (min-width: 720px) {
    .st-grid { grid-template-columns: 1.5fr 1fr; align-items: start; }
  }

  .st-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
  }
  .st-panel + .st-panel { margin-top: 14px; }

  .st-period-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 18px 0 8px;
    font-weight: 600;
  }
  .st-period-label:first-child { margin-top: 0; }

  .st-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 8px;
    border-radius: 10px;
    cursor: pointer;
    transition: background .12s ease;
  }
  .st-item:hover { background: var(--surface-2); }
  .st-item.done { opacity: 0.55; }

  .st-check {
    width: 22px; height: 22px; border-radius: 7px;
    border: 1.5px solid var(--border);
    flex-shrink: 0;
    margin-top: 2px;
    display: flex; align-items: center; justify-content: center;
    transition: all .12s ease;
  }
  .st-item.done .st-check { background: var(--mint); border-color: var(--mint); }
  .st-check svg { width: 13px; height: 13px; opacity: 0; transition: opacity .1s; }
  .st-item.done .st-check svg { opacity: 1; }

  .st-item-time {
    font-family: 'Space Grotesk';
    font-size: 12px;
    color: var(--mint);
    min-width: 42px;
    margin-top: 2px;
    font-weight: 600;
  }
  .st-item.done .st-item-time { color: var(--muted); }
  .st-item-title { font-size: 14px; font-weight: 600; line-height: 1.3; }
  .st-item.done .st-item-title { text-decoration: line-through; }
  .st-item-desc { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.35; }

  .st-ring-wrap { display: flex; align-items: center; gap: 16px; }
  .st-ring { width: 84px; height: 84px; flex-shrink: 0; }
  .st-ring-pct { font-family:'Space Grotesk'; font-size: 22px; font-weight: 700; }
  .st-ring-label { font-size: 12px; color: var(--muted); }

  .st-stat-row { display: flex; gap: 10px; margin-top: 14px; }
  .st-stat {
    flex: 1;
    background: var(--surface-2);
    border-radius: 10px;
    padding: 10px;
    text-align: center;
  }
  .st-stat .v { font-family:'Space Grotesk'; font-size: 18px; font-weight: 700; }
  .st-stat .k { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }

  .st-panel-title { font-size: 13px; font-weight: 700; margin-bottom: 12px; display:flex; align-items:center; gap:6px; }

  .st-energy-row { display: flex; gap: 6px; margin-top: 8px; }
  .st-energy-btn {
    flex: 1; padding: 10px 0; border-radius: 9px; border: 1px solid var(--border);
    background: var(--surface-2); cursor: pointer; font-size: 17px;
    transition: all .12s ease;
  }
  .st-energy-btn.active { border-color: var(--amber); background: var(--amber-dim); transform: scale(1.05); }
  .st-energy-hint { font-size: 11px; color: var(--muted); margin-top: 8px; line-height: 1.4; }

  .st-progressbar { height: 8px; background: var(--surface-2); border-radius: 6px; overflow: hidden; margin-top: 8px; }
  .st-progressbar > div { height: 100%; background: linear-gradient(90deg, var(--mint), var(--amber)); border-radius: 6px; transition: width .3s ease; }

  .st-reset { font-size: 11px; color: var(--muted); background: none; border: none; cursor: pointer; text-decoration: underline; margin-top: 10px; }
  .st-loading { color: var(--muted); font-size: 13px; padding: 20px; text-align: center; }
</style>

<div class="st-root" id="stRoot">
  <div class="st-loading">Загружаю трекер…</div>
</div>

<script>
(function(){
  const root = document.getElementById('stRoot');

  const WEEKDAY_ITEMS = [
    {id:'w1', time:'07:00', period:'Утро', title:'Подъём и ритуал', desc:'Вода, без телефона 15 мин'},
    {id:'w2', time:'07:20', period:'Утро', title:'Медитация', desc:'20 минут'},
    {id:'w3', time:'07:40', period:'Утро', title:'Завтрак', desc:'Без экранов'},
    {id:'w4', time:'08:30', period:'День', title:'Блок 1 — Касания', desc:'Первый контакт с лидами'},
    {id:'w5', time:'10:00', period:'День', title:'Перерыв', desc:'15 минут'},
    {id:'w6', time:'10:15', period:'День', title:'Блок 2 — Прогрев клиентов', desc:'Переписки, вовлечение'},
    {id:'w7', time:'13:00', period:'День', title:'Обед + прогулка', desc:''},
    {id:'w8', time:'14:00', period:'День', title:'Восстановительный блок', desc:'Сон / лежать без экрана'},
    {id:'w9', time:'14:30', period:'День', title:'Блок 3 — Прогрев / звонки', desc:''},
    {id:'w10', time:'16:00', period:'День', title:'Английский язык', desc:'45 минут'},
    {id:'w11', time:'16:45', period:'День', title:'Перерыв', desc:'10 минут'},
    {id:'w17', time:'16:55', period:'Вечер', title:'Обучение — курсы', desc:'Курсы, разборы кейсов, апдейты по нише'},
    {id:'w12', time:'17:35', period:'Вечер', title:'Блог в ТГК + Закрытие', desc:'Контент + дожим клиентов'},
    {id:'w13', time:'19:00', period:'Вечер', title:'Итоги дня', desc:'План на завтра'},
    {id:'w14', time:'19:30', period:'Вечер', title:'Личное время', desc:'Шахматы / покер, чтение'},
    {id:'w15', time:'21:00', period:'Вечер', title:'Подготовка ко сну', desc:'Без экранов'},
    {id:'w16', time:'22:30', period:'Вечер', title:'Отбой', desc:''},
  ];

  const WEEKEND_ITEMS = [
    {id:'e1', time:'08:00', period:'Утро', title:'Подъём', desc:'Без будильника, без телефона 15 мин'},
    {id:'e2', time:'09:00', period:'Утро', title:'Зарядка', desc:'Лёгкая — растяжка, прогулка'},
    {id:'e3', time:'09:20', period:'Утро', title:'Медитация', desc:''},
    {id:'e4', time:'09:40', period:'Утро', title:'Завтрак', desc:'Не спеша, без экранов'},
    {id:'e5', time:'10:30', period:'День', title:'Лёгкий обзор проекта', desc:'15–30 мин, по желанию'},
    {id:'e6', time:'11:30', period:'День', title:'Личное время / хобби', desc:''},
    {id:'e7', time:'13:30', period:'День', title:'Обед', desc:''},
    {id:'e8', time:'14:30', period:'День', title:'Восстановительный блок', desc:'Сон или отдых лёжа'},
    {id:'e9', time:'15:00', period:'День', title:'Английский + чтение', desc:'45 минут, свободный темп'},
    {id:'e16', time:'15:45', period:'День', title:'Обучение (по желанию)', desc:'Курс, лекция — без жёсткого тайминга'},
    {id:'e10', time:'16:30', period:'Вечер', title:'Личное время', desc:'Шахматы / покер, встречи'},
    {id:'e11', time:'18:30', period:'Вечер', title:'Ужин', desc:''},
    {id:'e12', time:'19:30', period:'Вечер', title:'Личное время / близкие', desc:''},
    {id:'e13', time:'21:30', period:'Вечер', title:'Итоги недели', desc:'Прогресс проекта + чек по энергии'},
    {id:'e14', time:'22:00', period:'Вечер', title:'Подготовка ко сну', desc:''},
    {id:'e15', time:'22:30', period:'Вечер', title:'Отбой', desc:''},
  ];
  function todayKey(d){ 
    const dt = d || new Date();
    return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');
  }
  function isWeekend(d){ const day = d.getDay(); return day === 0 || day === 6; }

  const state = {
    tab: isWeekend(new Date()) ? 'weekend' : 'weekday',
    date: todayKey(),
    checks: {},        // itemId -> bool for current date
    energy: null,
    startDate: null,
    streak: 0,
    loaded: false,
  };

  async function safeGet(key, shared){
    try {
      const r = await window.storage.get(key, shared || false);
      return r ? r.value : null;
    } catch(e){ return null; }
  }
  async function safeSet(key, value, shared){
    try { await window.storage.set(key, value, shared || false); } catch(e){ console.error('storage set failed', e); }
  }

  function itemsFor(tab){ return tab === 'weekend' ? WEEKEND_ITEMS : WEEKDAY_ITEMS; }

  async function loadDay(dateStr){
    const raw = await safeGet('day:' + dateStr);
    if (raw){
      try {
        const parsed = JSON.parse(raw);
        state.checks = parsed.checks || {};
        state.energy = typeof parsed.energy === 'number' ? parsed.energy : null;
      } catch(e){ state.checks = {}; state.energy = null; }
    } else {
      state.checks = {};
      state.energy = null;
    }
  }

  async function saveDay(){
    await safeSet('day:' + state.date, JSON.stringify({ checks: state.checks, energy: state.energy, tab: state.tab }));
  }

  async function loadSettings(){
    const raw = await safeGet('settings');
    if (raw){
      try { state.startDate = JSON.parse(raw).startDate; } catch(e){ state.startDate = null; }
    }
    if (!state.startDate){
      state.startDate = todayKey();
      await safeSet('settings', JSON.stringify({ startDate: state.startDate }));
    }
  }

  async function computeStreak(){
    let streak = 0;
    let d = new Date();
    // if today not finished yet, streak counts consecutive prior full-ish days
    for (let i = 0; i < 90; i++){
      const key = todayKey(d);
      const raw = await safeGet('day:' + key);
      if (!raw) { if (i === 0) { d.setDate(d.getDate()-1); continue; } break; }
      try {
        const parsed = JSON.parse(raw);
        const tab = parsed.tab || (isWeekend(d) ? 'weekend' : 'weekday');
        const total = itemsFor(tab).length;
        const done = Object.values(parsed.checks || {}).filter(Boolean).length;
        const pct = total ? done/total : 0;
        if (pct >= 0.7) { streak++; d.setDate(d.getDate()-1); }
        else break;
      } catch(e){ break; }
    }
    state.streak = streak;
  }

  function dayNumber(){
    const start = new Date(state.startDate + 'T00:00:00');
    const now = new Date(todayKey() + 'T00:00:00');
    const diff = Math.round((now - start) / 86400000) + 1;
    return Math.max(1, diff);
  }

  function completionPct(){
    const items = itemsFor(state.tab);
    const done = items.filter(it => state.checks[it.id]).length;
    return items.length ? Math.round((done/items.length)*100) : 0;
  }

  function ringSvg(pct){
    const r = 34, c = 2*Math.PI*r;
    const offset = c - (pct/100)*c;
    return `<svg class="st-ring" viewBox="0 0 84 84">
      <circle cx="42" cy="42" r="${r}" fill="none" stroke="#222639" stroke-width="8"/>
      <circle cx="42" cy="42" r="${r}" fill="none" stroke="url(#grad)" stroke-width="8"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${offset}"
        transform="rotate(-90 42 42)" style="transition: stroke-dashoffset .4s ease"/>
      <defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#35e0a0"/><stop offset="100%" stop-color="#ffb84d"/>
      </linearGradient></defs>
    </svg>`;
  }

  function groupByPeriod(items){
    const groups = {};
    items.forEach(it => { (groups[it.period] = groups[it.period] || []).push(it); });
    return groups;
  }

  const ENERGY_EMOJI = ['😞','😕','😐','🙂','🚀'];
  const ENERGY_LABEL = ['Совсем нет сил','Тяжело','Норм','Бодро','Полный ресурс'];

  async function toggleItem(id){
    state.checks[id] = !state.checks[id];
    render();
    await saveDay();
    await computeStreak();
    render();
  }

  async function setEnergy(idx){
    state.energy = idx;
    render();
    await saveDay();
  }

  async function switchTab(tab){
    state.tab = tab;
    await loadDay(state.date);
    render();
  }

  async function changeStartDate(val){
    state.startDate = val;
    await safeSet('settings', JSON.stringify({ startDate: state.startDate }));
    render();
  }

  async function resetDay(){
    state.checks = {};
    state.energy = null;
    render();
    await saveDay();
    await computeStreak();
    render();
  }

  function render(){
    const items = itemsFor(state.tab);
    const groups = groupByPeriod(items);
    const pct = completionPct();
    const doneCount = items.filter(it => state.checks[it.id]).length;
    const dNum = dayNumber();
    const dTotal = 90;
    const dPct = Math.min(100, Math.round((dNum/dTotal)*100));

    let itemsHtml = '';
    Object.keys(groups).forEach(period => {
      itemsHtml += `<div class="st-period-label">${period}</div>`;
      groups[period].forEach(it => {
        const done = !!state.checks[it.id];
        itemsHtml += `
          <div class="st-item ${done ? 'done' : ''}" data-id="${it.id}">
            <div class="st-check">
              <svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9 17.5L20 6.5" stroke="#0d1a14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <div class="st-item-time">${it.time}</div>
            <div>
              <div class="st-item-title">${it.title}</div>
              ${it.desc ? `<div class="st-item-desc">${it.desc}</div>` : ''}
            </div>
          </div>`;
      });
    });

    let energyHtml = '';
    ENERGY_EMOJI.forEach((emo, idx) => {
      const active = state.energy === idx;
      energyHtml += `<button class="st-energy-btn ${active ? 'active' : ''}" data-energy="${idx}" title="${ENERGY_LABEL[idx]}">${emo}</button>`;
    });

    root.innerHTML = `
      <div class="st-header">
        <div>
          <div class="st-title st-display">Трекер дня</div>
          <div class="st-sub">Спринт на 90 дней · чек-ины держат темп без выгорания</div>
        </div>
        <div class="st-daybadge">
          <div class="num">${dNum} / 90</div>
          <div class="lbl">день спринта</div>
          <input type="date" id="startDateInput" value="${state.startDate}">
        </div>
      </div>

      <div class="st-tabs">
        <div class="st-tab ${state.tab === 'weekday' ? 'active' : ''}" data-tab="weekday">Будни</div>
        <div class="st-tab ${state.tab === 'weekend' ? 'active' : ''}" data-tab="weekend">Выходные</div>
      </div>

      <div class="st-grid">
        <div class="st-panel">
          ${itemsHtml}
        </div>

        <div>
          <div class="st-panel">
            <div class="st-panel-title">📊 Продуктивность сегодня</div>
            <div class="st-ring-wrap">
              ${ringSvg(pct)}
              <div>
                <div class="st-ring-pct">${pct}%</div>
                <div class="st-ring-label">${doneCount} из ${items.length} пунктов</div>
              </div>
            </div>
            <div class="st-stat-row">
              <div class="st-stat">
                <div class="v">🔥 ${state.streak}</div>
                <div class="k">Стрик, дней</div>
              </div>
              <div class="st-stat">
                <div class="v">${dPct}%</div>
                <div class="k">Прогресс 90 дней</div>
              </div>
            </div>
            <button class="st-reset" id="resetBtn">Сбросить отметки за сегодня</button>
          </div>

          <div class="st-panel">
            <div class="st-panel-title">⚡ Как сегодня с энергией?</div>
            <div class="st-energy-row">${energyHtml}</div>
            <div class="st-energy-hint">После выгорания это твой ранний сигнал. Пара дней подряд на "тяжело" — повод облегчить день, а не перетерпеть.</div>
          </div>

          <div class="st-panel">
            <div class="st-panel-title">🎯 До цели</div>
            <div class="st-sub" style="margin-bottom:2px">2 000 000 за 90 дней</div>
            <div class="st-progressbar"><div style="width:${dPct}%"></div></div>
            <div class="st-sub" style="margin-top:6px">Осталось ${Math.max(0, dTotal - dNum)} дней</div>
          </div>
        </div>
      </div>
    `;

    root.querySelectorAll('.st-item').forEach(el => {
      el.addEventListener('click', () => toggleItem(el.getAttribute('data-id')));
    });
    root.querySelectorAll('.st-tab').forEach(el => {
      el.addEventListener('click', () => switchTab(el.getAttribute('data-tab')));
    });
    root.querySelectorAll('.st-energy-btn').forEach(el => {
      el.addEventListener('click', () => setEnergy(parseInt(el.getAttribute('data-energy'))));
    });
    document.getElementById('resetBtn').addEventListener('click', resetDay);
    document.getElementById('startDateInput').addEventListener('change', (e) => changeStartDate(e.target.value));
  }

  async function init(){
    await loadSettings();
    await loadDay(state.date);
    await computeStreak();
    render();
  }

  init();
})();
</script>
